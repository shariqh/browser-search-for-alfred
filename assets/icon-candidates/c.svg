<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Candidate C: a bookmark ribbon tucked behind a search lens whose glass shows
       a clock (history). Cream plate, ink lens, coral ribbon. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#F2DCBC"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4543F"/>
      <stop offset="1" stop-color="#F47A62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5A3A14" flood-opacity="0.3"/>
    </filter>
    <clipPath id="plate-shape">
      <rect x="32" y="32" width="448" height="448" rx="100"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="32.5" y="32.5" width="447" height="447" rx="99.5" fill="none" stroke="#000" stroke-opacity="0.06"/>

  <!-- Bookmark ribbon hanging from the top edge -->
  <g clip-path="url(#plate-shape)">
    <path d="M326 20 H396 V228 L361 200 L326 228 Z" fill="url(#ribbon)" filter="url(#lift)"/>
  </g>

  <!-- Lens -->
  <g filter="url(#lift)">
    <line x1="300" y1="332" x2="392" y2="424" stroke="#26324A" stroke-width="46" stroke-linecap="round"/>
    <circle cx="216" cy="248" r="112" fill="#FFFFFF"/>
  </g>
  <circle cx="216" cy="248" r="112" fill="none" stroke="#26324A" stroke-width="32"/>

  <!-- Clock face inside the glass -->
  <g stroke="#26324A" stroke-linecap="round">
    <line x1="216" y1="166" x2="216" y2="180" stroke-width="10"/>
    <line x1="298" y1="248" x2="284" y2="248" stroke-width="10"/>
    <line x1="216" y1="330" x2="216" y2="316" stroke-width="10"/>
    <line x1="134" y1="248" x2="148" y2="248" stroke-width="10"/>
    <line x1="216" y1="248" x2="216" y2="192" stroke-width="16"/>
    <line x1="216" y1="248" x2="174" y2="222" stroke-width="16"/>
  </g>
  <circle cx="216" cy="248" r="13" fill="#E4543F"/>
</svg>

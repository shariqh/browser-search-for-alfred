<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Candidate A: a magnifier over a browser window's strip of tabs.
       Teal plate, white window, amber lens. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F5A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#062E2B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="window">
      <rect x="88" y="120" width="336" height="264" rx="28"/>
    </clipPath>
    <clipPath id="glass">
      <circle cx="306" cy="304" r="60"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)" filter="url(#shadow)"/>

  <!-- Window -->
  <rect x="88" y="120" width="336" height="264" rx="28" fill="#FFFFFF" filter="url(#lift)"/>
  <g clip-path="url(#window)">
    <!-- Tab bar -->
    <rect x="88" y="120" width="336" height="64" fill="#CBECE7"/>
    <!-- Active tab, joined to the page -->
    <path d="M100 184 Q114 184 114 170 V150 Q114 136 128 136 H206 Q220 136 220 150 V170 Q220 184 234 184 Z" fill="#FFFFFF"/>
    <!-- Other tabs -->
    <rect x="240" y="144" width="80" height="28" rx="10" fill="#9BD6CE"/>
    <rect x="330" y="144" width="80" height="28" rx="10" fill="#9BD6CE"/>
  </g>
  <!-- Page lines -->
  <rect x="120" y="212" width="176" height="18" rx="9" fill="#B7E4DF"/>
  <rect x="120" y="250" width="120" height="18" rx="9" fill="#B7E4DF"/>
  <rect x="120" y="288" width="92" height="18" rx="9" fill="#B7E4DF"/>
  <rect x="120" y="326" width="68" height="18" rx="9" fill="#B7E4DF"/>

  <!-- Magnifier -->
  <g filter="url(#lift)">
    <line x1="362" y1="360" x2="414" y2="412" stroke="#F59E0B" stroke-width="34" stroke-linecap="round"/>
    <circle cx="306" cy="304" r="73" fill="#FFF7E6"/>
  </g>
  <g clip-path="url(#glass)">
    <rect x="252" y="276" width="160" height="22" rx="11" fill="#4FB3A8"/>
    <rect x="252" y="314" width="96" height="22" rx="11" fill="#4FB3A8"/>
  </g>
  <circle cx="306" cy="304" r="73" fill="none" stroke="#F59E0B" stroke-width="26"/>
</svg>

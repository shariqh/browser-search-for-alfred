<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Candidate B: a stack of window cards with a search lens in front.
       Midnight-indigo plate, periwinkle cards, pink lens. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F8F"/>
      <stop offset="1" stop-color="#161937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B0D22" flood-opacity="0.45"/>
    </filter>
    <clipPath id="glass">
      <circle cx="328" cy="324" r="54"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)" filter="url(#shadow)"/>

  <!-- Back card -->
  <g filter="url(#lift)">
    <rect x="84" y="92" width="244" height="172" rx="24" fill="#6772D8"/>
    <rect x="84" y="92" width="244" height="40" rx="20" fill="#525DC4"/>
  </g>
  <!-- Middle card -->
  <g filter="url(#lift)">
    <rect x="124" y="140" width="244" height="172" rx="24" fill="#A3ADF5"/>
    <path d="M148 140 H344 A24 24 0 0 1 368 164 V180 H124 V164 A24 24 0 0 1 148 140 Z" fill="#8792EC"/>
  </g>
  <!-- Front card -->
  <g filter="url(#lift)">
    <rect x="164" y="188" width="244" height="172" rx="24" fill="#FFFFFF"/>
    <path d="M188 188 H384 A24 24 0 0 1 408 212 V228 H164 V212 A24 24 0 0 1 188 188 Z" fill="#E3E6FC"/>
  </g>
  <circle cx="186" cy="208" r="7" fill="#A3ADF5"/>
  <circle cx="208" cy="208" r="7" fill="#A3ADF5"/>
  <rect x="190" y="252" width="104" height="16" rx="8" fill="#D4D8FA"/>
  <rect x="190" y="284" width="72" height="16" rx="8" fill="#D4D8FA"/>
  <rect x="190" y="316" width="52" height="16" rx="8" fill="#D4D8FA"/>

  <!-- Lens -->
  <g filter="url(#lift)">
    <line x1="376" y1="372" x2="420" y2="416" stroke="#FF5C8A" stroke-width="32" stroke-linecap="round"/>
    <circle cx="328" cy="324" r="66" fill="#FFF0F5"/>
  </g>
  <g clip-path="url(#glass)">
    <rect x="282" y="298" width="140" height="20" rx="10" fill="#8792EC"/>
    <rect x="282" y="332" width="80" height="20" rx="10" fill="#8792EC"/>
  </g>
  <circle cx="328" cy="324" r="66" fill="none" stroke="#FF5C8A" stroke-width="24"/>
</svg>

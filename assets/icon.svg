<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Candidate A: an amber magnifier over a browser window's strip of tabs,
       its glass enlarging the tabs. Teal plate, white window, amber lens. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F5A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#062E2B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="window-shape">
      <rect x="80" y="128" width="352" height="264" rx="30"/>
    </clipPath>
    <clipPath id="glass">
      <circle cx="292" cy="175" r="61"/>
    </clipPath>
    <!-- Everything inside the window, drawn once and reused enlarged in the lens -->
    <g id="contents">
      <rect x="40" y="88" width="432" height="344" fill="#FFFFFF"/>
      <!-- Tab bar -->
      <rect x="40" y="88" width="432" height="120" fill="#A9DED6"/>
      <!-- Active tab, joined to the page -->
      <path d="M80 208 Q96 208 96 192 V162 Q96 146 112 146 H220 Q236 146 236 162 V192 Q236 208 252 208 Z" fill="#FFFFFF"/>
      <circle cx="124" cy="177" r="9" fill="#14B8A6"/>
      <rect x="142" y="172" width="70" height="10" rx="5" fill="#B7E4DF"/>
      <!-- Other tabs -->
      <rect x="250" y="156" width="84" height="38" rx="12" fill="#6FC2B7"/>
      <circle cx="270" cy="175" r="8" fill="#FFFFFF"/>
      <rect x="284" y="171" width="38" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
      <rect x="342" y="156" width="78" height="38" rx="12" fill="#6FC2B7"/>
      <circle cx="362" cy="175" r="8" fill="#FFFFFF"/>
      <rect x="376" y="171" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)" filter="url(#shadow)"/>

  <!-- Window -->
  <rect x="80" y="128" width="352" height="264" rx="30" fill="#FFFFFF" filter="url(#lift)"/>
  <g clip-path="url(#window-shape)">
    <use xlink:href="#contents"/>
  </g>
  <!-- Page lines -->
  <rect x="112" y="252" width="168" height="22" rx="11" fill="#CBECE7"/>
  <rect x="112" y="298" width="112" height="22" rx="11" fill="#CBECE7"/>

  <!-- Magnifier over the tab strip -->
  <g filter="url(#lift)">
    <line x1="344" y1="227" x2="404" y2="287" stroke="#F59E0B" stroke-width="34" stroke-linecap="round"/>
    <circle cx="292" cy="175" r="73" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#glass)">
    <use xlink:href="#contents" transform="translate(292 175) scale(1.4) translate(-292 -175)"/>
  </g>
  <circle cx="292" cy="175" r="73" fill="none" stroke="#F59E0B" stroke-width="26"/>
</svg>
